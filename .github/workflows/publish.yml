name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that PyPI Trusted Publishing exchanges for an upload token,
      # so no PyPI API token has to be stored as a repository secret.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # A release build must not restore a cache that a pull request could have poisoned.
          enable-cache: false

      - name: Build the source distribution and wheel
        run: uv build

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
