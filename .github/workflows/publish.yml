name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that PyPI Trusted Publishing exchanges for an upload token,
      # so no PyPI API token has to be stored as a repository secret.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # A release build must not restore a cache that a pull request could have poisoned.
          enable-cache: false

      - name: Build the source distribution and wheel
        run: uv build

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
